# Builds the signup app image on EVERY push to main, pushes it to GitHub's
# container registry tagged with the full commit SHA, then records that tag in
# deploy/values.yaml. ArgoCD sees that commit and rolls the app out.
#
# The tag-recording commit carries [skip ci], so it does not trigger another build.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/marlance/dokku-workshop:${{ steps.tag.outputs.tag }}
            ghcr.io/marlance/dokku-workshop:latest

      - name: Record the new tag for ArgoCD
        run: |
          sed -i -E 's|^(  tag: )"[^"]*"( # image-tag)$|\1"${{ steps.tag.outputs.tag }}"\2|' deploy/values.yaml
          if git diff --quiet deploy/values.yaml; then
            echo "tag unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/values.yaml
          git commit -m "deploy: image ${{ steps.tag.outputs.tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
