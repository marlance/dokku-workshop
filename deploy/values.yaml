# Helm values for the signup app on the konduit-mum1-kubefunk cluster.
# Chart: konstructio/konstruct-templates, path templates/konstruct-web-service.
# ArgoCD watches this file: change it, push to main, and the app rolls out.
#
# NOTHING SECRET GOES IN THIS FILE. Secrets live in the Kubernetes secret
# "dokku-workshop-env" in the dokku-workshop namespace (see deploy/README.md).

fullnameOverride: dokku-workshop

image:
  repository: ghcr.io/marlance/dokku-workshop
  # Updated automatically by .github/workflows/image.yml after each build.
  # To pin or roll back by hand, set it to any pushed tag (a full commit SHA).
  tag: "a9736432c734943fe385db7d7b1dd57604893e1f" # image-tag
  pullPolicy: Always

# Pull secret for the private GitHub container registry.
imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1
containerPort: 8080

service:
  port: 80
  targetPort: 8080

gateway:
  enabled: true
  host: dokku-workshop.mum1.apps.kubefunk.net

# Friendly address for attendees, served alongside the one above. The chart
# adds a route for it and gets a Let's Encrypt certificate over HTTP-01, so
# the DNS record (a CNAME to the host above) must be "DNS only" in Cloudflare,
# not proxied.
customDomain:
  enabled: true
  host: navigate-workshop.kubefunk.net

# The image declares a named user ("app"); Kubernetes can only verify
# runAsNonRoot against a numeric id, so state the id from the Dockerfile.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001

# No CPU or memory cap: a full room signing up at once must not be throttled
# or OOM-killed. "limits: null" is deliberate; leaving the key out would let
# the chart's default cap (500m / 512Mi) apply instead. Requests reserve a
# sensible share of the node for the app.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits: null

env:
  - name: PORT
    value: "8080"

  # Signup rate limit, per client IP per minute. A whole room shares one
  # public IP on venue Wi-Fi, so this is set far above any attendee count,
  # which in practice switches the limit off. (Do not set 0: that blocks
  # every signup.)
  - name: RATE_LIMIT_PER_MIN
    value: "100000"

  # ---- Workshop topology (not secret) ----
  - name: JUMP_HOST
    value: jump.kuberocket.com
  - name: JUMP_PUBLIC_IP
    value: 212.2.249.34
  - name: BASE_DOMAIN
    value: kuberocket.com
  - name: KEYADMIN_USER
    value: keyadmin
  # The app reaches the jump host on 2222 (it also listens on 22).
  - name: KEYCTL_PORT
    value: "2222"
  # Pinned host key of the jump host, keyed for port 2222 as "[host]:port".
  # Re-pin whenever the jump is rebuilt:
  #   ssh-keyscan -p 2222 -t ed25519 jump.kuberocket.com
  - name: KEYCTL_KNOWN_HOSTS
    value: "[jump.kuberocket.com]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBN+qB4cGyHsDSzvqedrjm7CoHNsocyBNH7XKsAIz0iB"

  # ---- Secrets, read from the Kubernetes secret "dokku-workshop-env" ----
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef: {name: dokku-workshop-env, key: DATABASE_URL}
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef: {name: dokku-workshop-env, key: SECRET_KEY}
  - name: WORKSHOP_CODE
    valueFrom:
      secretKeyRef: {name: dokku-workshop-env, key: WORKSHOP_CODE}
  - name: ADMIN_USER
    valueFrom:
      secretKeyRef: {name: dokku-workshop-env, key: ADMIN_USER}
  - name: ADMIN_PASSWORD
    valueFrom:
      secretKeyRef: {name: dokku-workshop-env, key: ADMIN_PASSWORD}
  - name: KEYCTL_PRIVATE_KEY_B64
    valueFrom:
      secretKeyRef: {name: dokku-workshop-env, key: KEYCTL_PRIVATE_KEY_B64}
